[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-replay-engine"
version = "0.1.0"
description = "LLM-assisted browser workflow discovery with deterministic replay and recovery"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "playwright",
    "pydantic",
    "typer",
    "pyyaml",
    "openai",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
include = ["cua*"]
