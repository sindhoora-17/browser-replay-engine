name: Dashboard Backend CI

on:
  push:
    branches: [main, "feature/**", "cleanup/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]" httpx
      - run: pytest -q tests/test_dashboard_api.py
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/test_dashboard_integration.py
      - run: python -m compileall -q cua/dashboard
